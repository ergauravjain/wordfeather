<title>DeutschMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an exam answer-booklet — cool paper, navy ink, signal-yellow highlighter marks; app bar on top, bottom tabs on phones. */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --sheet-2:#eef1f6; --rule:#dce2ea;
  --ink:#15203b; --ink-2:#47536b; --ink-3:#6b7690;
  --mark:#ffd23f; --mark-ink:#15203b;
  --primary:#15203b; --primary-ink:#ffffff;
  --good:#167a3e; --good-bg:#e3f4ea; --bad:#b4232a; --bad-bg:#fbe7e8; --warn:#9a5b00; --warn-bg:#fff3d6;
  --der:#1f5fd1; --die:#c42b4b; --das:#14805e;
  --a1:#16a34a; --a2:#2563eb; --b1:#c026d3; --b2:#ea580c; --c1:#0d9488;
  --track:#e3e8ef; --shadow:0 1px 2px rgba(21,32,59,.06),0 4px 16px rgba(21,32,59,.05);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1220; --sheet:#151c2c; --sheet-2:#1b2336; --rule:#28324a;
  --ink:#e9edf5; --ink-2:#aab4c8; --ink-3:#8791a8;
  --mark:#f2c94c; --mark-ink:#15203b;
  --primary:#e9edf5; --primary-ink:#11182a;
  --good:#4ade80; --good-bg:#11301f; --bad:#f87171; --bad-bg:#3a1619; --warn:#fbbf24; --warn-bg:#352a0e;
  --der:#6ea2ff; --die:#ff7a95; --das:#4fd3a5;
  --a1:#22c55e; --a2:#3b82f6; --b1:#d946ef; --b2:#f97316; --c1:#14b8a6;
  --track:#26304a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1220; --sheet:#151c2c; --sheet-2:#1b2336; --rule:#28324a;
  --ink:#e9edf5; --ink-2:#aab4c8; --ink-3:#8791a8;
  --mark:#f2c94c; --mark-ink:#15203b;
  --primary:#e9edf5; --primary-ink:#11182a;
  --good:#4ade80; --good-bg:#11301f; --bad:#f87171; --bad-bg:#3a1619; --warn:#fbbf24; --warn-bg:#352a0e;
  --der:#6ea2ff; --die:#ff7a95; --das:#4fd3a5;
  --a1:#22c55e; --a2:#3b82f6; --b1:#d946ef; --b2:#f97316; --c1:#14b8a6;
  --track:#26304a; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .subtle{color:var(--ink-3)}
.small{font-size:.875rem} .xs{font-size:.78rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mark{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mark) 75%,transparent) 58%,color-mix(in srgb,var(--mark) 75%,transparent) 92%,transparent 92%);padding:0 .1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App chrome */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1180px;margin:0 auto;padding-inline:16px;height:60px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:none;border:0;padding:0}
.flag{width:22px;height:22px;border-radius:6px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr 1fr;flex:none}
.flag i:nth-child(1){background:#111}.flag i:nth-child(2){background:#dd0000}.flag i:nth-child(3){background:#ffce00}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--ink-2);font-weight:700;font-size:.92rem}
.nav button:hover{background:var(--sheet-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sheet)}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:700;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--ink-3)}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar svg{width:20px;height:20px}
  main{padding-bottom:96px!important}
}
main{max-width:1180px;margin:0 auto;padding:24px 16px 56px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.sheet.flat{box-shadow:none}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid transparent;padding:9px 16px;font-weight:700;font-size:.93rem;line-height:1.2;transition:transform .08s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{opacity:.92}
.btn-ghost{background:var(--sheet);border-color:var(--rule)}
.btn-ghost:hover{background:var(--sheet-2)}
.btn-mark{background:var(--mark);color:var(--mark-ink)}
.btn-sm{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--mark);text-underline-offset:3px}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.next{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.next button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet-2);border:1px solid var(--rule);border-radius:11px;padding:10px 14px}
.next button:hover{border-color:var(--ink-3)}
.next .k{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;width:84px;flex:none}

/* Stat tiles */
.tile{display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

/* Level cards */
.lvl{position:relative;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.lvl:hover{border-color:var(--ink-3)}
.lvl.target{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc),var(--shadow)}
.lvl .code{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--lc)}
.lvl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--rule);padding-top:12px}
.counts b{display:block;font-family:var(--f-mono);font-size:1rem}
.badge-target{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--lc);border:1px solid var(--lc)}

/* Bars */
.bar-meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar-meter>i{display:block;height:100%;border-radius:99px}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.skill-row .bar-meter{grid-column:1/-1}

/* Activity */
.act{display:flex;align-items:flex-end;gap:5px;height:110px;border-bottom:1px solid var(--rule)}
.act .col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.act .col i{display:block;width:100%;background:var(--ink);opacity:.82;border-radius:4px 4px 0 0}
.act .col:hover i{opacity:1}
.act .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:3px 8px;font-size:.75rem;white-space:nowrap;display:none;z-index:2}
.act .col:hover .tip{display:block}
.act-x{display:flex;gap:5px;margin-top:5px}
.act-x span{flex:1;text-align:center;font-size:.68rem;color:var(--ink-3);font-family:var(--f-mono)}

/* Skill tiles in level view */
.skill{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.skill:hover{border-color:var(--ink-3)}
.skill .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--lc) 14%,transparent);color:var(--lc)}
.skill .ic svg{width:21px;height:21px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);text-align:left;width:100%}
.ex-item:hover{border-color:var(--ink-3)}
.score-pill{font-family:var(--f-mono);font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);white-space:nowrap}
.score-pill.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.score-pill.low{background:var(--warn-bg);color:var(--warn);border-color:transparent}

table.fmt{width:100%;border-collapse:collapse;font-size:.92rem}
table.fmt td,table.fmt th{padding:7px 0;border-top:1px solid var(--rule);text-align:left;font-weight:400}
table.fmt td:last-child,table.fmt th:last-child{text-align:right}
table.fmt tr:first-child td{border-top:0}
table.fmt tfoot th{font-weight:700}

/* Exercise player */
.player{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.player{grid-template-columns:1fr}}
.passage{white-space:pre-wrap;font-size:1.02rem;line-height:1.7;max-width:68ch}
.stick{position:sticky;top:76px}
@media (max-width:900px){.stick{position:static}}
.q{padding:14px 0;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.q-head{display:flex;gap:10px;align-items:flex-start}
.q-num{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:36px}
.opts.tf{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);text-align:left;width:100%}
.opts.tf .opt{width:auto;min-width:120px}
.opt .box{width:20px;height:20px;border:1.5px solid var(--ink-2);border-radius:4px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:600;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sheet-2)}
.opt[aria-pressed="true"] .box{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.expl{margin-left:36px;padding:9px 12px;border-radius:10px;font-size:.9rem}
.expl.ok{background:var(--good-bg)} .expl.no{background:var(--bad-bg)}
@media (max-width:560px){.opts,.expl,.match-row{padding-left:0!important;margin-left:0!important}.match-row{grid-template-columns:1fr}}
.match-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-left:36px}
select,input[type=text],input[type=search],textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.star{border:0;background:none;padding:2px;color:var(--ink-3);margin-left:auto;flex:none}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:18px;height:18px}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;padding:5px 12px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.result{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--sheet-2);border:1px solid var(--rule)}
.audio{display:flex;flex-direction:column;gap:14px}
.wave{display:flex;align-items:center;gap:3px;height:42px}
.wave i{flex:1;background:var(--ink-3);border-radius:2px;opacity:.5}
.wave.playing i{animation:wv 1s ease-in-out infinite;opacity:.9;background:var(--ink)}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

/* Writing */
textarea.answer{width:100%;min-height:280px;line-height:1.7;resize:vertical;padding:14px}
.wc{display:flex;align-items:center;gap:10px;font-size:.88rem}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.band{font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.corr{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-top:1px dashed var(--rule)}
.corr s{color:var(--bad)} .corr ins{color:var(--good);text-decoration:none;font-weight:700}
.points-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.points-list li{display:flex;gap:10px;align-items:flex-start}
.points-list li::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--mark);flex:none}

/* Flashcards */
.card-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.fcard{width:min(100%,560px);min-height:300px;border-radius:18px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;cursor:pointer}
.fcard .word{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;overflow-wrap:anywhere}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,560px)}
.grades .btn{flex-direction:column;gap:2px;padding:10px 4px}
.grades small{font-family:var(--f-mono);font-weight:500;font-size:.7rem;opacity:.8}
.boxes{display:flex;gap:4px}
.boxes i{width:22px;height:6px;border-radius:3px;background:var(--track)}
.boxes i.on{background:var(--ink)}
.gender{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,560px)}
.gender .btn{padding:16px 6px;font-size:1.2rem;font-family:var(--f-display)}
.g-der{background:color-mix(in srgb,var(--der) 14%,var(--sheet));color:var(--der);border-color:color-mix(in srgb,var(--der) 40%,transparent)}
.g-die{background:color-mix(in srgb,var(--die) 14%,var(--sheet));color:var(--die);border-color:color-mix(in srgb,var(--die) 40%,transparent)}
.g-das{background:color-mix(in srgb,var(--das) 14%,var(--sheet));color:var(--das);border-color:color-mix(in srgb,var(--das) 40%,transparent)}
.seg{display:inline-flex;background:var(--sheet-2);border:1px solid var(--rule);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.dict-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.chips-ans{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:8px;border:1.5px dashed var(--rule);border-radius:10px}
.wchip{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:5px 10px;font-weight:700}

.notice{padding:10px 14px;border-radius:11px;background:var(--warn-bg);color:var(--ink);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:9px 16px;border-radius:11px;font-weight:700;font-size:.9rem;z-index:50}
.src{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.src:first-of-type{border-top:0}
.src code{font-family:var(--f-mono);font-size:.82rem}
a{color:var(--ink)}
.pass{color:var(--good);font-weight:800} .fail{color:var(--bad);font-weight:800}
.mock-sec{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.mock-sec>div{padding:12px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<header class="bar"><div class="bar-in">
  <button class="logo" data-go="home" aria-label="DeutschMaster home"><span class="flag" aria-hidden="true"><i></i><i></i><i></i></span><span>Deutsch<span class="mark">Master</span></span></button>
  <nav class="nav" aria-label="Main" id="nav"></nav>
  <div class="bar-right" id="barRight"></div>
</div></header>
<main id="app" tabindex="-1"></main>
<nav class="tabbar" aria-label="Main" id="tabbar"></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("repo-data").textContent);
const LEVELS = ["A1","A2","B1","B2","C1"];
const SKILLS = { R:{de:"Lesen",en:"Reading"}, L:{de:"Hören",en:"Listening"}, W:{de:"Schreiben",en:"Writing"}, S:{de:"Sprechen",en:"Speaking"} };
const LV = {

// ───────────────────────── Text-to-speech (browser voices, de-DE)
const TTS = {
  ok: "speechSynthesis" in window,
  voices: [],
  load(){ if(!this.ok) return; const v=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)); if(v.length) this.voices=v; },
  speak(text,{rate=.95,onend}={}){
    if(!this.ok){ onend?.(); return false; }
    speechSynthesis.cancel(); this.load();
    // Dialogues: "Name: text" lines get alternating voices / pitch per speaker.
    const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean); const speakers={};
    const parts=lines.map(line=>{ const m=line.match(/^([A-ZÄÖÜ][\wäöüß. ]{0,20}):\s+(.*)$/); if(!m) return {t:line,s:0}; if(!(m[1] in speakers)) speakers[m[1]]=Object.keys(speakers).length; return {t:m[2],s:speakers[m[1]]}; });
    parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p.t); u.lang="de-DE"; u.rate=rate;
      if(this.voices.length) u.voice=this.voices[p.s % this.voices.length]; u.pitch = p.s%2 ? 1.25 : 1;
      if(i===parts.length-1) u.onend=()=>onend?.(); speechSynthesis.speak(u); });
    return true;
  },
  stop(){ if(this.ok) speechSynthesis.cancel(); }
};
if(TTS.ok){ TTS.load(); speechSynthesis.onvoiceschanged=()=>TTS.load(); }

let samplerP = null;
const getSampler = () => samplerP ??= (window.claude?.use ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null));
const BAND_PCT = {A:100,B:75,C:50,D:25,E:0};
function heuristicGrade(text,ex){
  const n=words(text), [lo]=ex.words||[40]; const conn=(text.match(/\b(weil|deshalb|denn|aber|trotzdem|außerdem|zuerst|danach|einerseits|andererseits|obwohl|dass|wenn|jedoch|daher|zudem)\b/gi)||[]).length;
  const greet=/^(liebe|lieber|hallo|hi|sehr geehrte)/i.test(text.trim()), close=/(grüße|gruß|bis bald|tschüss)/i.test(text);
  const uniq=new Set((text.toLowerCase().match(/\p{L}+/gu)||[])).size; const band=x=>"EDCBA"[Math.max(0,Math.min(4,Math.round(x)))];
  return { source:"offline", criteria:{
    task:{band:band(n<lo*.6?Math.min(1,n/lo*2):Math.min(n/lo,1)*3+(greet&&close?1:0)),note:`${n} words (target ${ex.words.join("–")}). ${greet&&close?"Greeting and closing present.":"Add a greeting and a closing."}`},
    coherence:{band:band(Math.min(1+Math.min(conn,3),n/lo*4)),note:`${conn} linking words found (weil, deshalb, außerdem …).`},
    vocabulary:{band:band(Math.min(n?uniq/n*5:0,n/lo*4)),note:`${uniq} different words.`},
    grammar:{band:"C",note:"Grammar can't be checked offline. Connect AI grading for line-by-line corrections."}},
    corrections:[], summary:"Rule-based estimate only." };
}
async function aiGrade(text,ex,kind="writing"){
  const sample = await getSampler();
  if(!sample) return heuristicGrade(text,ex);
  const prompt = `You are a certified examiner for the ${ex.level} German exam (Goethe-Institut criteria). Grade this ${kind==="speaking"?"transcript of a spoken answer":"written answer"}.
Task (${ex.part}): ${ex.prompt}
Content points the answer must cover: ${(ex.points||[]).join("; ")}
${ex.words?`Target length: ${ex.words[0]}–${ex.words[1]} words.`:""}
Answer:
"""${text}"""

Return ONLY JSON with this shape:
{"criteria":{"task":{"band":"A|B|C|D|E","note":"..."},"coherence":{"band":"...","note":"..."},"vocabulary":{"band":"...","note":"..."},"grammar":{"band":"...","note":"..."}},"corrections":[{"original":"exact phrase from the answer","corrected":"fixed German","why":"short English reason"}],"summary":"2 sentences in English with the most important advice"}
Bands follow the Goethe scale for ${ex.level} (A = fully meets the level, E = not assessable). Give at most 6 corrections, most important first. Notes in English, max 20 words each.`;
  try{ const r = await sample.json(prompt,{modelTier:"default"}); if(!r?.criteria) throw 0; r.source="ai"; return r; }
  catch(e){ const h=heuristicGrade(text,ex); h.summary=(e?.code==="not_granted"?"AI grading was not allowed for this page, so this is a rule-based estimate.":"AI grading isn't available right now, so this is a rule-based estimate."); return h; }
}

  return `<section class="sheet" aria-labelledby="src"><div class="sec-head"><div><h2 id="src">Where the content comes from</h2><p class="small muted">Built from your German repositories. Each one supplies a different part of the app.</p></div><span class="chip">Progress saved to: ${storeMode==="account"?"your account":"this browser"}</span></div>
  <div>
   <div class="src"><code>wordfeather</code><span class="small">${st.words.toLocaleString("de-DE")} A1–C1 words with examples and topics (<code>words_final.json</code>) power the flashcards and the dictionary. ${st.grammar} grammar questions (<code>grammar_*.json</code>) power the grammar trainer. Its exam formats shaped the tasks.</span></div>
   <div class="src"><code>german-nouns</code><span class="small">The Wiktionary noun lexicon (${st.nounsLexicon.toLocaleString("de-DE")} lemmas) adds the plural to ${st.plurals.toLocaleString("de-DE")} nouns on the flashcards and in the der/die/das trainer.</span></div>
   <div class="src"><code>GermanWordEmbeddings</code><span class="small">The evaluation sets (opposites, odd one out, analogies, plurals) become the four word games under Wortschatz.</span></div>
   <div class="src"><code>German-NLP</code><span class="small">Curated tools for learners: <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool</a> (spelling and grammar check), <a href="https://github.com/gambolputty/wiktionary-de-parser" target="_blank" rel="noopener">wiktionary-de-parser</a>, <a href="https://github.com/jfilter/german-lemmatizer" target="_blank" rel="noopener">german-lemmatizer</a> and the open <a href="https://github.com/thorstenMueller/deep-learning-german-tts" target="_blank" rel="noopener">Thorsten German voice</a> for TTS.</span></div>
  </div></section>`;
}

VIEWS.levels = () => `<div class="stack"><div><p class="eyebrow">Stufen</p><h1>Levels A1 – C1</h1><p class="muted" style="margin-top:6px;max-width:62ch">Pick the level you're preparing for. Your target level drives the dashboard, the mock exam and the suggested next task.</p></div><div class="grid g3">${LEVELS.map(levelCard).join("")}</div></div>`;

VIEWS.level = () => {
  const l=V.level||S.target, info=LV[l], c=lvColor(l), m=levelMastery(l);
  const skillCard=k=>{ const xs=EXAMS[l].filter(e=>e.skill===k); return `<section class="sheet" style="--lc:${c}">
    <div class="row" style="gap:12px;margin-bottom:12px"><span class="skill"><span class="ic">${ICON[k]}</span></span><div style="flex:1;min-width:0"><h3>${SKILLS[k].de} <span class="subtle" style="font-weight:500">· ${SKILLS[k].en}</span></h3><p class="xs subtle">${xs.length} tasks · ${skillMastery(l,k)}% mastery</p></div></div>
    ${meter(skillMastery(l,k),c,SKILLS[k].en+" mastery")}
    <div class="ex-list" style="margin-top:14px">${xs.map(exItem).join("")}</div></section>`; };
  return `<div class="stack">
  <p class="small subtle"><button class="linkbtn" data-go="levels">Levels</button> / ${l}</p>
  <header class="row" style="justify-content:space-between;align-items:flex-start">
    <div style="max-width:640px"><div class="row" style="gap:14px"><span style="font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;color:${c}">${l}</span><div><h1 style="font-size:1.6rem">${info.name}</h1><p class="small subtle">${info.de}</p></div></div>
      <p class="muted" style="margin-top:10px">${info.sum}</p>
      <div class="row" style="margin-top:14px">${S.target===l?`<span class="chip"><span class="dot" style="background:${c}"></span>Your target level</span>`:`<button class="btn btn-ghost btn-sm" data-act="target" data-level="${l}">Set ${l} as target</button>`}
      <button class="btn btn-primary btn-sm" data-go="mock" data-level="${l}">${ICON.mock.replace("<svg",'<svg width="16" height="16"')} Mock exam ${l}</button></div></div>
    ${ring(m,104,9,c,`<div><div class="mono" style="font-weight:600;font-size:1.15rem">${m}%</div><div class="eyebrow" style="font-size:.6rem">mastery</div></div>`,`${l} mastery`)}
  </header>
  <div class="grid g2">${["R","L","W","S"].map(skillCard).join("")}</div>
  <div class="grid g2">
    <section class="sheet" style="--lc:${c}"><div class="row" style="gap:12px"><span class="skill"><span class="ic">${ICON.G}</span></span><div><h3>Grammatik</h3><p class="xs subtle">${gramBy[l].length} questions from wordfeather · ${gramAcc(l)}% accuracy</p></div></div>
      <p class="small muted" style="margin:12px 0">${[...new Set(gramBy[l].map(g=>g.t))].slice(0,6).map(esc).join(" · ")}${new Set(gramBy[l].map(g=>g.t)).size>6?" …":""}</p>
      <button class="btn btn-primary btn-sm" data-go="grammar" data-level="${l}">Start a 10-question round</button></section>
    <section class="sheet" style="--lc:${c}"><div class="row" style="gap:12px"><span class="skill"><span class="ic">${ICON.V}</span></span><div><h3>Wortschatz</h3><p class="xs subtle">${vocabBy[l].length} words · ${vocabLearned(l)} learned · ${dueCount(l)} due</p></div></div>
      <p class="small muted" style="margin:12px 0">${[...new Set(vocabBy[l].map(v=>v.c))].slice(0,7).map(esc).join(" · ")}</p>
      <div class="row"><button class="btn btn-primary btn-sm" data-go="vocab" data-tab="srs" data-level="${l}">Flashcards</button><button class="btn btn-ghost btn-sm" data-go="vocab" data-tab="gender" data-level="${l}">der · die · das</button></div></section>
  </div>
  <section class="sheet"><h2>Exam format</h2><p class="small muted" style="margin-bottom:10px">${esc(info.exams.join(" · "))}. Section times follow the Goethe format; check the provider's current Modellsatz before your exam.</p>
    <table class="fmt"><tbody>${info.fmt.map(([s,mn])=>`<tr><td>${s}</td><td class="mono">${mn} min</td></tr>`).join("")}</tbody><tfoot><tr><th>Total · pass mark 60 % per module</th><th class="mono">${info.fmt.reduce((a,f)=>a+f[1],0)} min</th></tr></tfoot></table></section>
  </div>`;
};
function exItem(e){
  const b=S.ex[e.id]; const meta=e.skill==="W"?`${e.words[0]}–${e.words[1]} words`:e.skill==="S"?`${Math.round(e.prep/60)||1} min prep · ${Math.round(e.speak/60)} min`:`${e.q.reduce((s,q)=>s+(q.t==="match"?q.left.length:1),0)} items · ${e.min} min`;
  return `<button class="ex-item" data-go="exercise" data-id="${e.id}"><span style="min-width:0"><span class="eyebrow">${esc(e.part)}</span><br><b>${esc(e.title)}</b><br><span class="xs subtle">${meta}${e.plays?` · plays ${e.plays}×`:""}</span></span>
    ${b?`<span class="score-pill ${b.best>=60?"ok":"low"}">${b.best}%</span>`:'<span class="score-pill">new</span>'}</button>`;
}

// ── Exercise player (practice mode; the mock exam reuses the same renderers)
let A = {}; // answers: A[exId] = {q:[...], text, plays, graded, ...}
const ans = id => A[id] ??= { q:[], plays:0, text:S.writing[id]?.text||"", checked:false };
function scoreObjective(e){
  const a=ans(e.id); let got=0,max=0;
  e.q.forEach((q,i)=>{ if(q.t==="match"){ q.a.forEach((v,j)=>{ max++; if((a.q[i]||[])[j]===v) got++; }); } else { max++; if(a.q[i]===q.a) got++; } });
  return {got,max,p:pct(got,max)};
}
function questionHTML(e,q,i,exam){
  const a=ans(e.id), done=a.checked&&!exam, qid=`${e.id}#${i}`, bm=S.bm.some(b=>b.id===qid);
  const star=exam?"":`<button class="star" data-act="bm" data-q="${qid}" aria-pressed="${bm}" aria-label="Bookmark question" title="Bookmark for later">${bm?ICON.star:ICON.starO}</button>`;
  let body="";
  if(q.t==="tf"||q.t==="mc"){
    const opts=q.t==="tf"?[["richtig",true],["falsch",false]]:q.o.map((o,j)=>[o,j]);
    body=`<div class="opts ${q.t==="tf"?"tf":""}">${opts.map(([lab,val],j)=>{ const sel=a.q[i]===val; let cls=""; if(done){ if(val===q.a) cls="right"; else if(sel) cls="wrong"; }
      return `<button class="opt ${cls}" data-act="pick" data-ex="${e.id}" data-i="${i}" data-v='${JSON.stringify(val)}' aria-pressed="${sel}" ${done?"disabled":""}><span class="box">${q.t==="tf"?(val?"R":"F"):"abc"[j]}</span><span>${esc(lab)}</span></button>`; }).join("")}</div>`;
  } else {
    body=q.left.map((L,j)=>{ const v=(a.q[i]||[])[j]; const ok=done&&v===q.a[j];
      return `<div class="match-row"><span class="small">${j+1}. ${esc(L)}</span><select data-act="match" data-ex="${e.id}" data-i="${i}" data-j="${j}" aria-label="Match for item ${j+1}" ${done?"disabled":""} style="${done?`border-color:${ok?"var(--good)":"var(--bad)"}`:""}">
        <option value="">–</option>${q.right.map((r,k)=>`<option value="${k}" ${v===k?"selected":""}>${esc(r)}</option>`).join("")}<option value="-1" ${v===-1?"selected":""}>0</option></select></div>`; }).join("");
  }
  const right = q.t==="match" ? q.a.every((v,j)=>(a.q[i]||[])[j]===v) : a.q[i]===q.a;
  return `<div class="q"><div class="q-head"><span class="q-num">${i+1}</span><b style="flex:1">${esc(q.s)}</b>${star}</div>${body}
    ${done?`<div class="expl ${right?"ok":"no"}"><b>${right?"Richtig.":"Leider falsch."}</b> ${esc(q.x)}</div>`:""}</div>`;
}
function objectivePanel(e,exam){
  const listen=e.skill==="L", a=ans(e.id), left=(e.plays||99)-a.plays;
  const src = listen ? `<section class="sheet stick audio"><p class="eyebrow">Audio · ${e.plays}× abspielbar</p>
      <div class="wave" id="wave-${e.id}" aria-hidden="true">${[...Array(32)].map((_,k)=>`<i style="height:${30+((k*37)%70)}%;animation-delay:${(k%8)*.1}s"></i>`).join("")}</div>
      <div class="row"><button class="btn btn-primary" data-act="play" data-ex="${e.id}" ${left<=0?"disabled":""}>${ICON.play} ${a.plays?"Nochmal abspielen":"Abspielen"}</button><span class="mono small muted">${a.plays} / ${e.plays} played</span></div>
      ${!TTS.ok?'<p class="notice">This browser has no read-aloud, so the transcript is shown instead.</p>':""}
      ${(a.checked&&!exam)||!TTS.ok?`<details ${!TTS.ok?"open":""}><summary class="small" style="cursor:pointer;font-weight:700">Transkript</summary><p class="passage small" style="margin-top:8px">${esc(e.text)}</p></details>`:'<p class="xs subtle">The transcript unlocks after you check your answers. German speech uses your device\'s voices; dialogues alternate voices per speaker.</p>'}
    </section>`
    : `<section class="sheet stick"><p class="eyebrow">Text</p><div class="passage" style="margin-top:8px">${esc(e.text)}</div></section>`;
  return `<div class="player">${src}<section class="sheet"><p class="small muted" style="margin-bottom:12px">${esc(e.ins)}</p>${e.q.map((q,i)=>questionHTML(e,q,i,exam)).join("")}</section></div>`;
}
VIEWS.exercise = () => {
  const e=exById[V.id], a=ans(e.id), c=lvColor(e.level);
  const head=`<p class="small subtle"><button class="linkbtn" data-go="level" data-level="${e.level}">${e.level}</button> / ${SKILLS[e.skill].de}</p>
   <header class="row" style="justify-content:space-between"><div style="min-width:0"><p class="eyebrow" style="color:${c}">${esc(e.part)}</p><h1 style="font-size:1.7rem">${esc(e.title)}</h1></div>
   ${e.skill!=="S"?`<span class="timer" id="timer" aria-live="off">${fmtTime((e.min||0)*60)}</span>`:""}</header>`;
  let body="";
  if(e.skill==="R"||e.skill==="L"){
    const sc=a.checked?scoreObjective(e):null;
    body = objectivePanel(e,false) + `<div class="row">${a.checked
      ? `<div class="result" style="flex:1">${ring(sc.p,64,6,sc.p>=60?"var(--good)":"var(--bad)",null,"Score")}<div><b>${sc.got} of ${sc.max} correct</b><p class="small muted">${sc.p>=60?"Pass level (60 %) reached.":"Below the 60 % pass mark. Read the explanations, then try again."} Best: ${S.ex[e.id]?.best??sc.p}%</p></div><button class="btn btn-ghost" data-act="retry" data-ex="${e.id}" style="margin-left:auto">Try again</button></div>`
      : `<button class="btn btn-primary" data-act="check" data-ex="${e.id}">Antworten prüfen</button><span class="small subtle">Instant feedback with explanations.</span>`}</div>`;
  } else if(e.skill==="W") body = writingPanel(e,false);
  else body = speakingPanel(e);
  return `<div class="stack">${head}${body}</div>`;
};
after.exercise = () => { const e=exById[V.id]; if(e.skill!=="S"&&!ans(e.id).checked) startTimer(e.min*60, ()=>toast("Time's up. You can still finish and check."), "ex:"+e.id); if(e.skill==="W") bindWriting(e); };
function startTimer(sec,onEnd,key){ if(key&&T&&T.key===key) return; clearInterval(T?.id); const end=Date.now()+sec*1000; const tick=()=>{ const el=$("#timer"); const r=(end-Date.now())/1000; if(el){ el.textContent=fmtTime(r); el.classList.toggle("low",r<60); } if(r<=0){ clearInterval(T.id); onEnd?.(); } }; T={id:setInterval(tick,500),end,key}; tick(); }
function finishObjective(e){ const a=ans(e.id); a.checked=true; const sc=scoreObjective(e); const prev=S.ex[e.id]; S.ex[e.id]={best:Math.max(prev?.best||0,sc.p),n:(prev?.n||0)+1,last:Date.now()}; logHist(SKILLS[e.skill].de,`${e.level} · ${e.title}`,sc.p); save(); clearInterval(T?.id); T=null; }

function writingPanel(e,exam){
  const a=ans(e.id), r=!exam&&a.graded;
  return `<div class="player">
   <section class="sheet stick"><p class="eyebrow">Aufgabe</p><p style="margin:8px 0 14px">${esc(e.prompt)}</p>
     <p class="eyebrow" style="margin-bottom:8px">Schreiben Sie etwas zu allen Punkten</p><ul class="points-list">${e.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
     <p class="xs subtle" style="margin-top:14px">Rated on the four Goethe criteria: task completion, coherence, vocabulary, grammar (bands A–E).</p></section>
   <section class="sheet stack" style="gap:12px">
     <label for="wr-${e.id}" class="eyebrow">Ihr Text</label>
     <textarea class="answer" id="wr-${e.id}" data-ex="${e.id}" lang="de" spellcheck="false" placeholder="Liebe/Lieber … ">${esc(a.text)}</textarea>
     <div class="wc"><span class="mono" id="wc-${e.id}">${words(a.text)}</span><span class="muted">words · target ${e.words[0]}–${e.words[1]}</span><div style="flex:1">${meter(Math.min(100,pct(words(a.text),e.words[0])),"var(--ink)","Word count progress")}</div></div>
     ${exam?"":`<div class="row"><button class="btn btn-primary" data-act="grade" data-ex="${e.id}" ${words(a.text)<5?"disabled":""}>Grade my text</button><span class="xs subtle">Uses AI grading when allowed, otherwise a rule-based estimate.</span></div>`}
     ${a.grading?'<p class="notice">Grading your text …</p>':""}
     ${r?gradeHTML(a.graded):""}
   </section></div>`;
}
function gradeHTML(g){
  const p=gradePct(g); const lab={task:"Task completion",coherence:"Coherence",vocabulary:"Vocabulary",grammar:"Grammar"};
  return `<div class="stack" style="gap:12px"><div class="result">${ring(p,64,6,p>=60?"var(--good)":"var(--bad)",null,"Score")}<div><b>${p}% · ${p>=60?"pass level":"below 60 %"}</b><p class="small muted">${esc(g.summary||"")}</p><p class="xs subtle">${g.source==="ai"?"Graded by Claude":"Rule-based estimate"}</p></div></div>
   <div class="rubric">${Object.keys(lab).map(k=>`<div class="sheet flat" style="padding:12px"><div class="row" style="justify-content:space-between"><span class="eyebrow">${lab[k]}</span><span class="band">${esc(g.criteria[k]?.band||"–")}</span></div><p class="xs muted">${esc(g.criteria[k]?.note||"")}</p></div>`).join("")}</div>
   ${(g.corrections||[]).length?`<div><p class="eyebrow">Corrections</p>${g.corrections.map(c=>`<div class="corr small"><span><s>${esc(c.original)}</s> → <ins>${esc(c.corrected)}</ins></span><span class="xs subtle">${esc(c.why)}</span></div>`).join("")}</div>`:""}</div>`;
}
function bindWriting(e){ const ta=$("#wr-"+e.id); if(!ta) return; ta.addEventListener("input",()=>{ const a=ans(e.id); a.text=ta.value; const n=words(ta.value); $("#wc-"+e.id).textContent=n; const m=ta.closest("section").querySelector(".bar-meter i"); if(m) m.style.width=Math.min(100,pct(n,e.words[0]))+"%"; const b=ta.closest("section").querySelector('[data-act="grade"]'); if(b) b.disabled=n<5; S.writing[e.id]={text:ta.value}; clearTimeout(bindWriting.t); bindWriting.t=setTimeout(save,800); }); }

function speakingPanel(e){
  const a=ans(e.id);
  return `<div class="player">
   <section class="sheet stick"><p class="eyebrow">Aufgabenkarte</p><h2 style="margin:8px 0 12px">${esc(e.prompt)}</h2><ul class="points-list">${e.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
     <div class="row" style="margin-top:18px"><span class="timer" id="timer">${fmtTime(a.phase==="speak"?e.speak:e.prep)}</span>
      <button class="btn btn-primary" data-act="prep" data-ex="${e.id}">${a.phase?"Restart":"Start preparation"} · ${Math.round(e.prep/60)||1} min</button>
      <button class="btn btn-ghost" data-act="speak" data-ex="${e.id}">Start speaking · ${Math.round(e.speak/60)} min</button></div>
     <p class="xs subtle" style="margin-top:8px" id="phase">${a.phase==="speak"?"Speaking time. Talk out loud and record with your phone or computer.":a.phase==="prep"?"Preparation: make short notes, no full sentences.":"Prepare first, then speak for the full time."}</p></section>
   <section class="sheet stack" style="gap:14px">
     <label class="eyebrow" for="notes-${e.id}">Notizen</label><textarea id="notes-${e.id}" rows="4" lang="de" placeholder="Stichwörter …">${esc(a.notes||"")}</textarea>
     <div><p class="eyebrow" style="margin-bottom:6px">Your recording</p><p class="xs subtle" style="margin-bottom:8px">This page can't use the microphone directly. Record with your device's voice recorder, then add the file here to listen back.</p>
       <input type="file" accept="audio/*" data-act="audio" data-ex="${e.id}" aria-label="Add a recording">${a.audio?`<audio controls src="${a.audio}" style="width:100%;margin-top:8px"></audio>`:""}</div>
     <div><p class="eyebrow" style="margin-bottom:6px">Self-check: which points did you cover?</p>${e.points.map((p,j)=>`<label class="row small" style="gap:8px;margin:4px 0"><input type="checkbox" data-act="cover" data-ex="${e.id}" data-j="${j}" ${(a.cover||[])[j]?"checked":""}> ${esc(p)}</label>`).join("")}</div>
     <div><label class="eyebrow" for="tr-${e.id}">Optional: transcript for AI feedback</label><textarea id="tr-${e.id}" rows="3" lang="de" placeholder="Type or paste what you said …" style="width:100%;margin-top:6px">${esc(a.transcript||"")}</textarea></div>
     <div class="row"><button class="btn btn-primary" data-act="speakdone" data-ex="${e.id}">Save result</button><button class="btn btn-ghost" data-act="speakai" data-ex="${e.id}">Get feedback on transcript</button></div>
     ${a.grading?'<p class="notice">Grading …</p>':""}${a.graded?gradeHTML(a.graded):""}
   </section></div>`;
}

// ── Grammar trainer (wordfeather grammar_*.json)
let G = null;
VIEWS.grammar = () => {
  const l=V.level||S.target;
  if(!G||G.level!==l||V.fresh){ const topics=V.topic; const pool=gramBy[l].filter(g=>!topics||g.t===topics); G={level:l,qs:pick(pool,10),i:0,right:0,answered:null,order:[]}; V.fresh=false; }
  const q=G.qs[G.i];
  if(!q) return `<div class="stack"><p class="small subtle"><button class="linkbtn" data-go="level" data-level="${l}">${l}</button> / Grammatik</p><section class="sheet" style="text-align:center;padding:40px 20px">${ring(pct(G.right,G.qs.length),110,9,"var(--ink)",null,"Round score")}<h2 style="margin-top:14px">${G.right} of ${G.qs.length} correct</h2><p class="muted">${l} accuracy overall: ${gramAcc(l)}%</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-primary" data-act="gnew">Next round</button><button class="btn btn-ghost" data-go="level" data-level="${l}">Back to ${l}</button></div></section></div>`;
  const done=G.answered!==null; const correctTxt=Array.isArray(q.c)?q.c.join(" "):q.c;
  let input="";
  if(q.k==="mc") input=`<div class="opts" style="padding-left:0">${q.o.map((o,j)=>{ let cls=""; if(done){ if(o===q.c) cls="right"; else if(G.answered===o) cls="wrong"; } return `<button class="opt ${cls}" data-act="gmc" data-v="${esc(o)}" ${done?"disabled":""}><span class="box">${"abcd"[j]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
  else if(q.k==="fill_blank") input=`<form class="row" data-act="gfill"><input type="text" id="gfill" lang="de" autocomplete="off" aria-label="Your answer" ${done?"disabled":""} value="${done?esc(G.answered):""}" style="flex:1;min-width:160px;font-size:1.1rem"><button class="btn btn-primary" ${done?"disabled":""}>Check</button></form>`;
  else { const pool=q.o.map((w,j)=>({w,j})).filter(x=>!G.order.includes(x.j)); input=`<div class="chips-ans" aria-label="Your sentence">${G.order.map(j=>`<button class="wchip" data-act="gunword" data-j="${j}" ${done?"disabled":""}>${esc(q.o[j])}</button>`).join("")}</div><div class="row" style="margin-top:8px">${pool.map(x=>`<button class="wchip" data-act="gword" data-j="${x.j}" ${done?"disabled":""}>${esc(x.w)}</button>`).join("")}</div>${!done&&G.order.length===q.o.length?'<button class="btn btn-primary" data-act="gorder" style="margin-top:10px">Check</button>':""}`; }
  const ok=done&&G.ok;
  return `<div class="stack"><p class="small subtle"><button class="linkbtn" data-go="level" data-level="${l}">${l}</button> / Grammatik</p>
   <header class="row" style="justify-content:space-between"><div><p class="eyebrow">${esc(q.t)}</p><h1 style="font-size:1.6rem">Grammatik ${l}</h1></div><span class="mono muted">${G.i+1} / ${G.qs.length} · ${G.right} ✓</span></header>
   <section class="sheet stack" style="gap:14px;max-width:760px"><p style="font-size:1.3rem;font-family:var(--f-display);font-weight:700">${esc(q.q)}</p><p class="small subtle">${esc(q.qe)}</p>${input}

let VC = null;
function buildQueue(l,cat){
  const t=dayNum(); const pool=vocabBy[l].filter(v=>!cat||v.c===cat);
  const due=pool.filter(v=>S.srs[v.i]&&S.srs[v.i][1]<=t); const fresh=pool.filter(v=>!S.srs[v.i]);
  return [...shuffle(due).slice(0,20), ...fresh.slice(0,Math.max(0,15-due.length))];
}
function schedule(s,grade){ // s=[box,due,ease,ivl]; returns new state
  let [box,,ease,ivl]=s||[0,0,2.5,0]; const t=dayNum();
  if(grade===0) return [1,t,Math.max(1.3,ease-.2),0];
  if(grade===1){ ease=Math.max(1.3,ease-.15); ivl=Math.max(1,Math.round(ivl*1.2)); box=Math.max(1,box); }
  else { if(grade===3) ease+=.15; ivl = ivl===0 ? (grade===3?4:1) : ivl<3 ? (grade===3?8:6) : Math.round(ivl*ease*(grade===3?1.3:1)); box=Math.min(5,box+(grade===3?2:1)); }
  return [box,t+ivl,+ease.toFixed(2),ivl];
}

  if(kind==="odd"){ const s=pick(DATA.oddone,1)[0]; const odd=pick(s.n,1)[0]; return {kind,q:"Welches Wort passt nicht?",o:shuffle([...s.g,odd]),a:odd,x:`${s.g.join(", ")} gehören zusammen.`}; }
  if(kind==="ana"){ const cats=[...new Set(DATA.analogies.map(a=>a[0]))]; const cat=pick(cats,1)[0]; const rows=DATA.analogies.filter(a=>a[0]===cat); const [p,q]=pick(rows,2); const wrong=pick(rows.filter(r=>r!==q).map(r=>r[2]),3); return {kind,q:`${p[1]} : ${p[2]} = ${q[1]} : ?`,o:shuffle([q[2],...wrong]),a:q[2],x:`${cat}: ${q[1]} → ${q[2]}`}; }

    <section class="sheet"><h2 style="margin-bottom:6px">Bookmarked questions</h2>${S.bm.length?S.bm.map(b=>{const [id,i]=b.id.split("#"); const e=exById[id]; return e?`<div class="dict-row"><button class="linkbtn" data-go="exercise" data-id="${id}" style="text-align:left">${esc(e.level)} · ${esc(e.title)}</button><span class="xs subtle">Q${+i+1}</span><span class="small muted" style="grid-column:1/-1">${esc(e.q[i]?.s||"")}</span></div>`:""}).join(""):'<p class="small muted">Tap the star on any reading or listening question to save it here for review.</p>'}</section></div>
   <section class="sheet"><h2 style="margin-bottom:6px">Recent activity</h2>${S.hist.length?S.hist.slice(0,25).map(h=>`<div class="dict-row"><span class="small"><b>${esc(h.kind)}</b> · ${esc(h.label)}<br><span class="xs subtle">${new Date(h.ts).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"})}</span></span><span class="score-pill ${h.p>=60?"ok":"low"}">${h.p}%</span></div>`).join(""):'<p class="small muted">Nothing yet. Your completed tasks, grammar rounds and mock exams will be listed here.</p>'}</section>
   <section class="sheet row" style="justify-content:space-between"><span class="small muted">Start over with an empty profile.</span>${confirm?`<span class="row"><span class="small"><b>Delete all progress?</b></span><button class="btn btn-sm" style="background:var(--bad);color:#fff" data-act="reset">Delete</button><button class="btn btn-ghost btn-sm" data-go="progress">Cancel</button></span>`:'<button class="btn btn-ghost btn-sm" data-act="askreset">Reset progress</button>'}</section></div>`;
};

// ───────────────────────── Events (delegated)
document.addEventListener("click", async ev => {
  const el=ev.target.closest("[data-go],[data-act]"); if(!el) return;
  const d=el.dataset;
  if(d.act==="target"){ ev.stopPropagation(); S.target=d.level; save(); toast(`Target level set to ${d.level}`); render(); return; }
  if(d.go){ const p={}; ["level","id","tab","game","topic"].forEach(k=>{ if(d[k]) p[k]=d[k]; }); if(d.go==="grammar") p.fresh=true; if(d.go==="vocab"&&!p.level&&V.level) p.level=V.level; go(d.go,p); return; }
  const e=d.ex?exById[d.ex]:null;
  switch(d.act){
    case "pick": { const a=ans(e.id); a.q[+d.i]=JSON.parse(d.v); if(V.name==="exercise") render(); else { el.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b===el)); } break; }
    case "check": finishObjective(e); render(); break;
    case "retry": A[e.id]={q:[],plays:0,text:"",checked:false}; render(); break;
    case "bm": { const i=S.bm.findIndex(b=>b.id===d.q); if(i>=0) S.bm.splice(i,1); else S.bm.unshift({id:d.q,ts:Date.now()}); save(); el.setAttribute("aria-pressed",i<0); el.innerHTML=i<0?ICON.star:ICON.starO; toast(i<0?"Bookmarked":"Bookmark removed"); break; }
    case "play": { const a=ans(e.id); if(a.plays>=(e.plays||99)) break; a.plays++;
      if(V.name==="exercise") render(); else { el.nextElementSibling.textContent=`${a.plays} / ${e.plays} played`; if(a.plays>=e.plays) el.disabled=true; }
      const w=()=>$("#wave-"+e.id); w()?.classList.add("playing");
      if(!TTS.speak(e.text,{onend:()=>w()?.classList.remove("playing")})) w()?.classList.remove("playing"); break; }
    case "grade": { const a=ans(e.id); a.grading=true; render(); const g=await aiGrade(a.text,e); a.grading=false; a.graded=g; a.checked=true; const p=gradePct(g); S.ex[e.id]={best:Math.max(S.ex[e.id]?.best||0,p),n:(S.ex[e.id]?.n||0)+1,last:Date.now()}; S.writing[e.id]={text:a.text}; logHist("Schreiben",`${e.level} · ${e.title}`,p); save(); render(); break; }
    case "prep": case "speak": { const a=ans(e.id); a.phase=d.act; a.notes=$("#notes-"+e.id)?.value; T=null; render(); startTimer(d.act==="prep"?e.prep:e.speak,()=>{ if(a.phase==="prep"){ a.phase="speak"; T=null; render(); startTimer(e.speak,()=>toast("Speaking time is over."),"speak:"+e.id+Date.now()); } else toast("Speaking time is over."); },d.act+":"+e.id+Date.now()); break; }
    case "speakdone": { const a=ans(e.id); a.notes=$("#notes-"+e.id)?.value; const p=speakPct(e); S.ex[e.id]={best:Math.max(S.ex[e.id]?.best||0,a.graded?Math.round((p+gradePct(a.graded))/2):p),n:(S.ex[e.id]?.n||0)+1,last:Date.now()}; logHist("Sprechen",`${e.level} · ${e.title}`,S.ex[e.id].best); save(); toast(`Saved: ${S.ex[e.id].best}%`); render(); break; }
    case "speakai": { const a=ans(e.id); a.transcript=$("#tr-"+e.id)?.value||""; a.notes=$("#notes-"+e.id)?.value; if(words(a.transcript)<5){ toast("Add a transcript of at least a few sentences first."); break; } a.grading=true; render(); a.graded=await aiGrade(a.transcript,{...e,words:null},"speaking"); a.grading=false; render(); break; }
    case "flip": VC.flip=!VC.flip; render(); break;
    case "grade-card": { const v=VC.q.shift(); S.srs[v.i]=schedule(S.srs[v.i],+d.g); if(+d.g===0) VC.q.splice(Math.min(3,VC.q.length),0,v); VC.flip=false; VC.done++; save(); render(); break; }
    case "vmore": { const fresh=vocabBy[VC.level].filter(v=>!S.srs[v.i]&&(!VC.cat||v.c===VC.cat)).slice(0,15); VC.q=fresh; render(); break; }
    case "say": say(d.t); break;
    case "gpick": { VC.gans=d.a; S.gender.seen++; if(d.a===VC.g.a) S.gender.right++; save(); render(); break; }
    case "gnextn": VC.g=null; VC.gl=null; render(); break;
    case "gmc": gAnswer(d.v===G.qs[G.i].c,d.v); break;
    case "gword": G.order.push(+d.j); render(); break;
    case "gunword": G.order=G.order.filter(j=>j!==+d.j); render(); break;
    case "gorder": { const q=G.qs[G.i]; const got=G.order.map(j=>q.o[j]); const ok=[q.c,...(q.ao||[])].some(o=>norm(o.join(" "))===norm(got.join(" "))); gAnswer(ok,got.join(" ")); break; }
    case "gnext": G.i++; G.answered=null; G.order=[]; render(); break;
    case "gnew": G=null; V.fresh=true; render(); break;
    case "wpick": wAnswer(d.v); break;
    case "wnext": GM={...newGame(GM.kind),pick:null,score:GM.score,n:GM.n}; render(); break;
    case "mockstart": { LEVELS.forEach(l=>EXAMS[l].forEach(x=>{ if(x.level===d.level) delete A[x.id]; })); M={level:d.level,scale:+d.scale,sec:0,sc:{},report:null}; go("mockrun"); break; }
    case "mocknext": mockNext(); break;
    case "askreset": V.confirmReset=true; render(); break;
    case "reset": { const t=S.target; S=blank(); S.target=t; A={}; save(); go("progress"); toast("Progress deleted"); break; }
  }
});
document.addEventListener("change", ev => {
  const el=ev.target, d=el.dataset; const e=d.ex?exById[d.ex]:null;
  if(d.act==="match"){ const a=ans(e.id); const arr=a.q[+d.i]??=[]; arr[+d.j]=el.value===""?undefined:+el.value; }
  if(d.act==="vcat"){ V.cat=el.value; VC=null; render(); }
  if(d.act==="cover"){ const a=ans(e.id); (a.cover??=[])[+d.j]=el.checked; }
  if(d.act==="selfrate"){ const a=ans(e.id); a.self=+el.value; el.nextElementSibling.textContent=["weak","fair","okay","good","very good"][a.self]; }
  if(d.act==="audio"&&el.files?.[0]){ const a=ans(e.id); if(a.audio) URL.revokeObjectURL(a.audio); a.audio=URL.createObjectURL(el.files[0]); a.notes=$("#notes-"+e.id)?.value; render(); }
});
document.addEventListener("input", ev => { const d=ev.target.dataset; if(d.act==="selfrate") ev.target.dispatchEvent(new Event("change",{bubbles:true})); });
document.addEventListener("submit", ev => {
  ev.preventDefault(); const f=ev.target.dataset.act;
  if(f==="gfill"){ const v=$("#gfill").value; if(!v.trim()) return; const q=G.qs[G.i]; gAnswer(norm(v)===norm(q.c),v); }
  if(f==="wplu"){ const v=$("#wplu").value; if(v.trim()) wAnswer(v); }
});
document.addEventListener("keydown", ev => {
  if(ev.target.matches("input,textarea,select")) return;
  if(V.name==="vocab"&&(V.tab||"srs")==="srs"&&VC?.q[0]){
    if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); VC.flip=!VC.flip; render(); }
    if(VC.flip&&["1","2","3","4"].includes(ev.key)) $(`[data-act="grade-card"][data-g="${+ev.key-1}"]`)?.click();
  }
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches(".lvl")){ ev.preventDefault(); ev.target.click(); }
});

// ───────────────────────── Boot
loadLocal();
render();
initCloud();
</script>
